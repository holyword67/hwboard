[package]
name = "hwboard"
version = "0.1.0"
edition = "2024"

[dependencies]
puffin      = "0.19.1"
puffin_http = { version = "0.16.0", optional = true }
rayon = "1.12.0"
wgpu = "29.0.3"
bytemuck = "1.25.0"
pollster = "0.4.0"
sdl3 = { version = "0.18.4", features = ["raw-window-handle"] }
image = "0.25.10"

[features]
profiling = ["dep:puffin_http"]

[profile.release]
opt-level = 3
