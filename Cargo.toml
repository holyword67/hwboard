[package]
name = "hwboard"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12"
wgpu = "30.0"
bytemuck = "1"
pollster = "1"
sdl3 = { version = "0.18", features = ["raw-window-handle", "build-from-source-static"] }
image = "0.25"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
dirs = "6"

[features]

[profile.release]
opt-level = 3

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "macro_systems"
harness = false # divan 자체 하네스를 사용하기 위해 필수
